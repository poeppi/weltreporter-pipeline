name: Post today's article

on:
  schedule:
    - cron: '0 8 * * *'   # daily 08:00 UTC = 10:00 CEST / 09:00 CET
  workflow_dispatch:        # manual trigger via GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit schedule.json back to repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Post today's article
        env:
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
          CIRCLE_COMMUNITY_ID: ${{ secrets.CIRCLE_COMMUNITY_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        run: python post_today.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "weltreporter-bot"
          git config user.email "actions@github.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "posted: $(date +%Y-%m-%d)"
          git push
